<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            box-sizing: border-box;
        }

        input {
            display: block;
        }

        #main {
            padding: 30px;
            width: 100%;
            height: 100%;
            background-color: #222;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        .card{
            max-width: 300px;
            margin-top: 40px;
            border-radius: 10px;
            display: inline-block;
            padding: 20px;
            border: 1px solid #555;
        }
        .profile{
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
        }

        .card h5{
            margin-top: 5px;
        }

        .card p{
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="name">
            <input type="text" placeholder="age">
            <input type="text" placeholder="email">
            <input type="text" placeholder="profile pic">
            <input type="submit">
        </form>

        <div class="card">
            <div class="profile"></div>
            <h3>Biswajit Rout</h3>
            <h5>Creative Coder</h5>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Aperiam quia sapiente voluptas suscipit, inventore quam asperiores velit sed, commodi nostrum adipisci, a molestias?</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
