<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #111;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .download-box {
        width: 220px;
        padding: 30px;
        background: #222;
        border-radius: 10px;
        text-align: center;
        color: white;
    }

    .download-box h3 {
        margin-bottom: 20px;
    }

    .progress {
        width: 100%;
        height: 8px;
        background: white;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-bar {
        width: 0%;
        height: 100%;
        background: #555;
    }

    .download-box p {
        margin-top: 10px;
    }
</style>

<body>

    <div class="download-box">
        <h3>Downloading...</h3>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        <p><span class="percentage">0</span>%</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
