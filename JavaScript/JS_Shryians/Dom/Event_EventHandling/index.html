<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "Gilroy";
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        #main {
            padding: 30px;
            width: 100%;
            min-height: 100%;
            background-color: #222;

            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        #btn {
            padding: 30px;
            background-color: rgb(41, 143, 114);
            color: white;
            font-weight: 600;
            border-radius: 5px;
        }

        .card {
            max-width: 300px;
            color: #fff;
            margin-top: 40px;
            border-radius: 10px;
            display: inline-block;
            padding: 20px;
            border: 1px solid #555;
        }

        .profile {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 7px;
            overflow: hidden;
        }

        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card h5 {
            margin-top: 3px;
        }

        .card p {
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <hr>

    <div id="main">

        <!-- FORM -->
        <form action="">
            <input type="text" placeholder="profile pic">
            <input type="text" placeholder="age">
            <input type="text" placeholder="email">
            <input type="text" placeholder="occuption">
            <input type="submit">
        </form>

    </div>
