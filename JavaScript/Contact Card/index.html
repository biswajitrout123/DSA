<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Call App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <button id="add-note" class="add-btn">
            +
        </button>

        <!-- Cards will be added here -->
        <div id="cards-container"></div>

    </main>


    <!-- Form Container -->

    <div class="form-container">

        <div class="form-box">

            <div class="form-header">
                <h2>New Call</h2>

                <button class="closeForm">
                    ×
                </button>
            </div>


            <form>

                <label>Image URL</label>

                <input required type="text" placeholder="https://example.com/photo.jpg">


                <label>Full Name</label>

                <input required type="text" placeholder="Enter full name">


                <label>Home Town</label>

                <input required type="text" placeholder="Enter home town">


                <label>Purpose</label>

                <input required type="text" placeholder="e.g., Quick appointment note">


                <label>Category</label>

                <div class="categories">

                    <label class="category">
                        <input required type="radio" name="category" value="emergency">

                        <span>Emergency</span>
                    </label>


                    <label class="category">
                        <input type="radio" name="category" value="important">

                        <span>Important</span>
                    </label>


                    <label class="category">
                        <input type="radio" name="category" value="urgent">

                        <span>Urgent</span>
                    </label>


                    <label class="category">
                        <input type="radio" name="category" value="norush">

                        <span>No Rush</span>
                    </label>

                </div>


                <button type="submit" class="submit-btn">
                    Create Note
                </button>


                <button type="button" class="close-btn">
                    Close
                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
